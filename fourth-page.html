<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration</title>
    <style>
        body {
            background-color: #ffebef;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: #ff4d6d;
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: red;
            opacity: 0.7;
            border-radius: 50%;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            from {
                transform: translateY(-100vh);
            }
            to {
                transform: translateY(100vh);
            }
        }
        iframe {
            position: absolute;
            top: -100vh; /* To hide iframe outside of the viewport initially */
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Prevent user from interacting with iframe */
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Create and append the confetti
            for (let i = 0; i < 100; i++) {
                let confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.animationDuration = (Math.random() * 2 + 1) + "s";
                document.body.appendChild(confetti);
            }
            // Create and append the iframe to play the YouTube video
            let iframe = document.createElement("iframe");
            iframe.src = "https://www.youtube.com/embed/kPa7bsKwL-c?autoplay=1"; // Autoplay the video
            document.body.appendChild(iframe);
        });
    </script>
</head>
<body>
    <h1>Yay! 🎉 Alexandra said YES! ❤️</h1>
</body>
</html>
