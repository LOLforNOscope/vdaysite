<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Button</title>
    <style>
        body {
            background-color: #ffebef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .heart-button {
            background-color: #ff4d6d;
            color: white;
            font-size: 2em;
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .heart-button:hover {
            background-color: #e63950;
        }
    </style>
</head>
<body>
    <a href="second-page.html" class="heart-button">❤️</a>
</body>
</html>
