<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal</title>
    <style>
        body {
            background-color: #ffebef;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 20px;
        }
        .button {
            background-color: #ff4d6d;
            color: white;
            font-size: 1.5em;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #e63950;
        }
        .image-container {
            margin-bottom: 20px;
        }
        .image-container img {
            max-width: 80%;
            height: auto;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="alinprostu.png" alt="Valentine Image">
    </div>
    <h1>Alexandra, will you be my valentine? ❤️</h1>
    <div class="buttons">
        <button class="button" onclick="window.location.href='fourth-page.html'">Yes</button>
        <button class="button" onclick="alert('Mai incerca odata! 😢')">No</button>
    </div>
</body>
</html>
